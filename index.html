
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="DPA — архитектурная мастерская Дмитрия Потаралова">
<title>DPA — Dmitrii Potaralov Architects</title>
<style>
* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: #fff;
  color: #171717;
  font-family: Arial, Helvetica, sans-serif;
  font-weight: 300;
}

a {
  color: inherit;
  text-decoration: none;
}

header {
  height: 76px;
  padding: 0 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -1.5px;
}

nav {
  display: flex;
  gap: 38px;
}

nav a {
  font-size: 11px;
  transition: color .2s;
}

nav a:hover { color: #a42b25; }

.projects {
  width: 80%;
  margin: 5.5vw auto 8vw;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 4.6vw;
}

.project {
  display: block;
  min-width: 0;
}

.project img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  background: #f0f0ee;
  transition: opacity .25s;
}

.project:hover img { opacity: .88; }

.project span {
  display: block;
  margin-top: 10px;
  font-size: 9px;
  font-weight: 300;
  letter-spacing: .045em;
  opacity: .72;
}

footer {
  display: flex;
  justify-content: space-between;
  padding: 24px 5% 30px;
  color: #777;
  font-size: 10px;
}

@media (max-width: 900px) {
  .projects {
    width: 85%;
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 600px) {
  header { height: 66px; }
  nav { gap: 14px; }
  nav a { font-size: 10px; }

  .projects {
    width: 90%;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 5vw;
  }

  .project span { font-size: 8px; }
}
</style>
</head>

<body>

<header>
  <a class="logo" href="index.html">DPA</a>
  <nav>
    <a href="#projects">Проекты</a>
    <a href="about.html">О бюро</a>
    <a href="contacts.html">Контакты</a>
  </nav>
</header>

<main>
<section class="projects" id="projects">

<a class="project" href="#">
<img src="project-01.jpg" alt="Жилой комплекс">
<span>ЖИЛОЙ КОМПЛЕКС</span>
</a>

<a class="project" href="#">
<img src="project-02.jpg" alt="Дом среди сосен">
<span>ДОМ СРЕДИ СОСЕН</span>
</a>

<a class="project" href="#">
<img src="project-03.jpg" alt="Экокурорт">
<span>ЭКОКУРОРТ</span>
</a>

<a class="project" href="#">
<img src="project-04.jpg" alt="Отель — гребной клуб">
<span>ОТЕЛЬ — ГРЕБНОЙ КЛУБ</span>
</a>

<a class="project" href="#">
<img src="project-05.jpg" alt="Дом Sky">
<span>ДОМ SKY</span>
</a>

<a class="project" href="#">
<img src="project-06.jpg" alt="ЖК 9 Ключей">
<span>ЖК 9 КЛЮЧЕЙ</span>
</a>

<a class="project" href="#">
<img src="project-07.jpg" alt="ТЦ Smart, Ириновский">
<span>ТЦ SMART, ИРИНОВСКИЙ</span>
</a>

</section>
</main>

<footer>
<span>DPA — Dmitrii Potaralov Architects</span>
<span>© 2026</span>
</footer>

</body>
</html>
