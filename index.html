
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="DPA — архитектурная мастерская Дмитрия Потаралова">
<title>DPA — Dmitrii Potaralov Architects</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #fff;
  color: #171717;
  font-family: Arial, Helvetica, sans-serif;
  font-weight: 300;
}

a {
  color: inherit;
  text-decoration: none;
}

/* HEADER */

header {
  width: 80%;
  height: 112px;
  margin: 0 auto;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  width: 105px;
  flex: 0 0 auto;
}

.logo img {
  display: block;
  width: 100%;
  height: auto;
}

nav {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 42px;
}

nav a {
  font-size: 16px;
  font-weight: 400;
  letter-spacing: .035em;
  text-transform: uppercase;
  transition: color .2s;
}

nav a:hover {
  color: #a42b25;
}

/* PROJECT GRID */

.projects {
  width: 80%;
  margin: 5.5vw auto 8vw;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 4.6vw;
  overflow: visible;
}

.project {
  display: block;
  min-width: 0;
  position: relative;
  z-index: 1;
}

.project:hover {
  z-index: 2;
}

.project img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  background: #f0f0ee;
  transition:
    transform .35s ease,
    opacity .35s ease;
  transform-origin: center center;
}

.project span {
  display: block;
  margin-top: 10px;
  font-size: 12px;
  font-weight: 300;
  letter-spacing: .045em;
  opacity: .72;
  transition: opacity .3s ease;
}

/* HOVER EFFECT */

@media (hover: hover) and (pointer: fine) {
  .project:hover img {
    transform: scale(1.03);
    opacity: .92;
  }

  .project:hover span {
    opacity: 1;
  }
}

/* FOOTER */

footer {
  display: flex;
  justify-content: space-between;
  padding: 24px 5% 30px;
  color: #777;
  font-size: 10px;
}

/* TABLET */

@media (max-width: 900px) {
  header {
    width: 85%;
  }

  .projects {
    width: 85%;
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .logo {
    width: 91px;
  }

  nav {
    gap: 28px;
  }

  nav a {
    font-size: 14px;
  }

  .project span {
    font-size: 11px;
  }
}

/* MOBILE */

@media (max-width: 600px) {
  header {
    width: 90%;
    height: 82px;
  }

  .logo {
    width: 62px;
  }

  nav {
    gap: 12px;
  }

  nav a {
    font-size: 9px;
    letter-spacing: 0;
  }

  .projects {
    width: 90%;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 5vw;
  }

  .project span {
    font-size: 9px;
  }

  footer {
    padding-left: 5%;
    padding-right: 5%;
    font-size: 9px;
  }
}

/* ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  .project img,
  .project span {
    transition: none;
  }
}
</style>
</head>

<body>

<header>
  <a class="logo" href="index.html" aria-label="DPA — Dmitrii Potaralov Architects">
    <img src="logo.svg" alt="DPA — Dmitrii Potaralov Architects">
  </a>

  <nav>
    <a href="#projects">Проекты</a>
    <a href="about.html">О бюро</a>
    <a href="contacts.html">Контакты</a>
  </nav>
</header>

<main>
<section class="projects" id="projects">

  <a class="project" href="#">
    <img src="project-01.jpg" alt="Жилой комплекс">
    <span>ЖИЛОЙ КОМПЛЕКС</span>
  </a>

  <a class="project" href="#">
    <img src="project-02.jpg" alt="Дом среди сосен">
    <span>ДОМ СРЕДИ СОСЕН</span>
  </a>

  <a class="project" href="#">
    <img src="project-03.jpg" alt="Экокурорт">
    <span>ЭКОКУРОРТ</span>
  </a>

  <a class="project" href="#">
    <img src="project-04.jpg" alt="Отель — гребной клуб">
    <span>ОТЕЛЬ — ГРЕБНОЙ КЛУБ</span>
  </a>

  <a class="project" href="nebo.html">
    <img src="project-05.jpg" alt="Дом Sky">
    <span>ДОМ SKY</span>
  </a>

  <a class="project" href="#">
    <img src="project-06.jpg" alt="ЖК 9 Ключей">
    <span>ЖК 9 КЛЮЧЕЙ</span>
  </a>

  <a class="project" href="#">
    <img src="project-07.jpg" alt="ТЦ Smart, Ириновский">
    <span>ТЦ SMART, ИРИНОВСКИЙ</span>
  </a>

</section>
</main>

<footer>
  <span>DPA — Dmitrii Potaralov Architects</span>
  <span>© 2026</span>
</footer>

</body>
</html>
