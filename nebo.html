<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="НЕБО — индивидуальный жилой дом в посёлке SKY11, Ленинградская область. Проект DPA.">
<title>НЕБО — DPA</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #fff;
  color: #171717;
  font-family: Arial, Helvetica, sans-serif;
  font-weight: 300;
}

a {
  color: inherit;
  text-decoration: none;
}

/* HEADER */

header {
  width: 80%;
  height: 112px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  width: 105px;
  flex: 0 0 auto;
}

.logo img {
  display: block;
  width: 100%;
  height: auto;
}

nav {
  display: flex;
  align-items: center;
  gap: 42px;
}

nav a {
  font-size: 16px;
  font-weight: 400;
  letter-spacing: .035em;
  text-transform: uppercase;
  transition: color .2s;
}

nav a:hover,
.back-link:hover {
  color: #a42b25;
}

/* MAIN */

main {
  width: 80%;
  max-width: 1440px;
  margin: 65px auto 120px;
}

.project-hero img {
  display: block;
  width: 100%;
  height: auto;
}

/* DESCRIPTION */

.project-intro {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8%;
  align-items: start;
  margin: 55px 0 75px;
}

h1 {
  margin: 0;
  font-size: clamp(48px, 7vw, 86px);
  line-height: .95;
  font-weight: 300;
  letter-spacing: -.065em;
  text-transform: uppercase;
}

.project-description {
  max-width: 570px;
  padding-top: 5px;
}

.project-description p {
  margin: 0 0 18px;
  font-size: clamp(16px, 1.4vw, 19px);
  line-height: 1.7;
  color: #333;
}

/* VIDEO */

.project-video {
  margin: 0 0 85px;
}

.project-video video {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  background: #f2f2f2;
}

/* GALLERY */

.gallery {
  display: flex;
  flex-direction: column;
  gap: 75px;
}

.gallery img {
  display: block;
  width: 100%;
  height: auto;
}

/* BACK LINK */

.project-bottom {
  margin-top: 100px;
}

.back-link {
  font-size: 13px;
  letter-spacing: .04em;
  transition: color .2s;
}

/* FOOTER */

footer {
  width: 90%;
  margin: 0 auto;
  padding: 25px 0 30px;
  display: flex;
  justify-content: space-between;
  color: #777;
  font-size: 10px;
}

/* TABLET */

@media (max-width: 900px) {
  header {
    width: 85%;
  }

  .logo {
    width: 91px;
  }

  nav {
    gap: 28px;
  }

  nav a {
    font-size: 14px;
  }

  main {
    width: 85%;
    margin-top: 50px;
  }

  .project-intro {
    gap: 6%;
    margin: 40px 0 60px;
  }

  .project-video {
    margin-bottom: 60px;
  }

  .gallery {
    gap: 50px;
  }
}

/* MOBILE */

@media (max-width: 600px) {
  header {
    width: 90%;
    height: 82px;
  }

  .logo {
    width: 62px;
  }

  nav {
    gap: 12px;
  }

  nav a {
    font-size: 9px;
    letter-spacing: 0;
  }

  main {
    width: 90%;
    margin-top: 35px;
    margin-bottom: 75px;
  }

  .project-intro {
    grid-template-columns: 1fr;
    gap: 25px;
    margin: 35px 0 45px;
  }

  h1 {
    font-size: 58px;
  }

  .project-description p {
    font-size: 15px;
    line-height: 1.7;
  }

  .project-video {
    margin-bottom: 40px;
  }

  .gallery {
    gap: 28px;
  }

  .project-bottom {
    margin-top: 55px;
  }

  footer {
    width: 90%;
    font-size: 9px;
    gap: 15px;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
}
</style>
</head>
